<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Young's Stock Daily · Favicon v2（黑金风 精简版）-->
  <defs>
    <linearGradient id="fav2-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1f2e"/>
      <stop offset="55%"  stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fav2-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8a6d3b"/>
      <stop offset="45%"  stop-color="#f0d88a"/>
      <stop offset="100%" stop-color="#a9843e"/>
    </linearGradient>
    <linearGradient id="fav2-gold-bright" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a849"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>

  <!-- 圆角深底 -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#fav2-base)"/>

  <!-- 菱形徽章（favicon 下描金粗一点以保证小尺寸可见） -->
  <polygon points="32,8 56,32 32,56 8,32"
           fill="none" stroke="url(#fav2-gold)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- 上升曲线（金色高光，更粗保证 16/32 尺寸可见） -->
  <path d="M 17 41 C 23 40, 27 37, 31 32 C 35 26, 40 23, 48 19"
        fill="none" stroke="url(#fav2-gold-bright)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 箭头 -->
  <path d="M 48 19 L 43.8 19.3 L 46.3 23 Z" fill="#f4d57a"/>
  <!-- 起点金点 -->
  <circle cx="17" cy="41" r="2.4" fill="#f0d88a"/>
</svg>
