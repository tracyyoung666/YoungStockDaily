<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Young's Stock Daily 品牌 Logo
       设计理念：深蓝金融底 + 上升K线 + 金色趋势线 + 星标 -->
  <defs>
    <!-- 主背景渐变：深蓝 → 靛蓝，金融科技感 -->
    <linearGradient id="ysd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="55%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 金色趋势线渐变 -->
    <linearGradient id="ysd-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <!-- 轻光晕 -->
    <radialGradient id="ysd-glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ysd-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ysd-glow)"/>

  <!-- 网格基准线（极淡，增加金融质感） -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="8"  y1="44" x2="56" y2="44"/>
    <line x1="8"  y1="34" x2="56" y2="34"/>
    <line x1="8"  y1="24" x2="56" y2="24"/>
  </g>

  <!-- K 线组：由左到右四根，高低点递增 -->
  <!-- 每根 K 线：影线 (line) + 实体 (rect)。涨柱留空描边，跌柱实心 -->

  <!-- K1：小跌（位置最低） -->
  <line x1="15" y1="36" x2="15" y2="48" stroke="#f87171" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="12.8" y="40" width="4.4" height="6" rx="0.8" fill="#ef4444"/>

  <!-- K2：小涨 -->
  <line x1="24" y1="28" x2="24" y2="42" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="21.8" y="31" width="4.4" height="8" rx="0.8" fill="none" stroke="#10b981" stroke-width="1.4"/>

  <!-- K3：中涨 -->
  <line x1="33" y1="20" x2="33" y2="36" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="30.8" y="23" width="4.4" height="10" rx="0.8" fill="none" stroke="#10b981" stroke-width="1.4"/>

  <!-- K4：大涨突破（实体最高，影线冲顶） -->
  <line x1="42" y1="10" x2="42" y2="30" stroke="#4ade80" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="39.6" y="14" width="4.8" height="12" rx="0.9" fill="#10b981" stroke="#34d399" stroke-width="0.8"/>

  <!-- 金色上升趋势线（穿过各 K 线高点，最后带箭头尖出） -->
  <path d="M 13 43 L 23 31 L 32 22 L 42 13 L 50 8"
        fill="none" stroke="url(#ysd-gold)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-opacity="0.95"/>
  <!-- 箭头 -->
  <path d="M 50 8 L 46.2 9 L 49 11.6 Z" fill="#fcd34d"/>

  <!-- 品牌小星标（右上） -->
  <path d="M 52 16 l 1.1 2.5 l 2.7 0.3 l -2 1.8 l 0.55 2.6 l -2.35 -1.3 l -2.35 1.3 l 0.55 -2.6 l -2 -1.8 l 2.7 -0.3 z"
        fill="#fde68a" opacity="0.95"/>

  <!-- 底部品牌字符 Y（极简、与 K 线呼应） -->
  <path d="M 16 54 L 20 50 L 24 54 M 20 50 L 20 56"
        stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <text x="28" y="57" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial" font-size="8" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="0.5">SD</text>
</svg>
