<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Young's Stock Daily · 主 Logo v2
       设计语言：瑞士私行 / 精品对冲基金 · 墨黑 + 香槟金
       主元素：描金菱形徽章 + 极简上升曲线 + 追踪金点
  -->
  <defs>
    <!-- 墨黑钻石渐变底 -->
    <linearGradient id="ysd2-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1f2e"/>
      <stop offset="55%"  stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- 香槟金渐变（主色） -->
    <linearGradient id="ysd2-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8a6d3b"/>
      <stop offset="35%"  stop-color="#d4a849"/>
      <stop offset="65%"  stop-color="#f0d88a"/>
      <stop offset="100%" stop-color="#a9843e"/>
    </linearGradient>

    <!-- 高光金（用于上升曲线，比外框更亮） -->
    <linearGradient id="ysd2-gold-bright" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b98a3d"/>
      <stop offset="45%"  stop-color="#f4d57a"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>

    <!-- 内层淡光 -->
    <radialGradient id="ysd2-inner-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- 圆角外框（深底） -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ysd2-base)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ysd2-inner-glow)"/>

  <!-- 描金细边框，提升精品质感 -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" ry="13.5"
        fill="none" stroke="url(#ysd2-gold)" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- 主元素：菱形徽章（描金双线） -->
  <!-- 外菱形 -->
  <polygon points="32,10 54,32 32,54 10,32"
           fill="none" stroke="url(#ysd2-gold)" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- 内菱形（更细，轻微内缩） -->
  <polygon points="32,15 49,32 32,49 15,32"
           fill="none" stroke="url(#ysd2-gold)" stroke-width="0.7" stroke-opacity="0.6" stroke-linejoin="round"/>

  <!-- 极简上升曲线（徽章中央，贝塞尔平滑） -->
  <path d="M 19 40 C 24 39, 27 37, 30 33 C 33 28, 37 25, 45 21"
        fill="none" stroke="url(#ysd2-gold-bright)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 曲线末端箭头（小三角，金色） -->
  <path d="M 45 21 L 41.2 21.4 L 43.4 24.6 Z"
        fill="#f4d57a"/>

  <!-- 追踪金点（曲线起点） -->
  <circle cx="19" cy="40" r="1.8" fill="#f0d88a"/>
  <circle cx="19" cy="40" r="3.2" fill="none" stroke="#d4a849" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- 顶部星标（极小，增加品牌辨识度） -->
  <path d="M 32 6.8 l 0.6 1.3 l 1.4 0.2 l -1 1 l 0.25 1.4 l -1.25 -0.7 l -1.25 0.7 l 0.25 -1.4 l -1 -1 l 1.4 -0.2 z"
        fill="url(#ysd2-gold)" opacity="0.9"/>

  <!-- 底部品牌缩写（精致小字） -->
  <text x="32" y="60" font-family="'Times New Roman', 'Noto Serif', serif"
        font-size="5.5" letter-spacing="2.5" font-weight="500"
        text-anchor="middle" fill="url(#ysd2-gold)" opacity="0.85">
    YSD
  </text>
</svg>
