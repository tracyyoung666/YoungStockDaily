<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="Young's Stock Daily — 每日自选股实时行情分析 + Web3 日报 + 自选股清单">
  <title>Young's Stock Daily · 股票 & Web3 投研日志</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EY%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <span class="logo">Y</span>
        <div>
          Young's Stock Daily
          <small>股票 &amp; Web3 投研日志 · 自托管 · 亮色主题</small>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">🏠 首页</a>
        <a href="portfolio.html">⭐ 自选股清单</a>
        <a href="https://github.com/tracyyoung666/YoungStockDaily" target="_blank" rel="noopener">🔗 GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 顶部 Tab 切换 -->
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="stock" role="tab">📈 股票分析报告</button>
      <button class="tab-btn" data-tab="web3" role="tab">🪙 Web3 日报</button>
      <button class="tab-btn" data-tab="portfolio" role="tab">⭐ 自选股速览</button>
    </div>

    <!-- Tab 1：股票分析 -->
    <section class="tab-panel active" data-panel="stock">
      <div class="filter-bar">
        <input type="text" id="search-stock" placeholder="🔍 搜索日期 / 标题 / 股票代码…">
        <select id="category-stock">
          <option value="">📂 全部分类</option>
        </select>
        <span class="count" id="count-stock">加载中…</span>
      </div>
      <div id="list-stock" class="report-list">
        <div class="empty-state"><h3>⏳ 加载中</h3><p>正在读取股票报告索引…</p></div>
      </div>
    </section>

    <!-- Tab 2：Web3 日报 -->
    <section class="tab-panel" data-panel="web3">
      <div class="filter-bar">
        <input type="text" id="search-web3" placeholder="🔍 搜索日期 / 关键词…">
        <span class="count" id="count-web3">加载中…</span>
      </div>
      <div id="list-web3" class="report-list">
        <div class="empty-state"><h3>⏳ 加载中</h3><p>正在读取 Web3 日报索引…</p></div>
      </div>
    </section>

    <!-- Tab 3：自选股速览 -->
    <section class="tab-panel" data-panel="portfolio">
      <div class="portfolio-summary">
        <div class="portfolio-head">
          <h2>⭐ 自选股清单速览</h2>
          <a class="btn-link" href="portfolio.html">查看完整清单 →</a>
        </div>
        <div id="portfolio-preview" class="portfolio-preview">
          <div class="empty-state"><h3>⏳ 加载中</h3><p>正在读取自选股清单…</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    © Young's Stock Daily · 本站内容仅为个人投资备忘，不构成任何投资建议<br>
    数据来源：westock-data · 新浪财经 · investment-masters · web3-daily
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
